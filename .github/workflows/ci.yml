name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Linux floor image tag and stage build context
        id: linux-image
        run: |
          input_digests="$(sha256sum \
            rig/linux/Dockerfile \
            rig/linux/entrypoint.sh \
            rig/xterm/package.json \
            rig/xterm/package-lock.json)"
          combined_hash="$(printf '%s\n' "$input_digests" | sha256sum | awk '{print $1}')"
          image_tag="avandar-tui-kit-linux:${combined_hash:0:12}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/linux-ctx/rig/linux" "${RUNNER_TEMP}/linux-ctx/rig/xterm"
          cp -p rig/linux/Dockerfile rig/linux/entrypoint.sh "${RUNNER_TEMP}/linux-ctx/rig/linux/"
          cp -p rig/xterm/package.json rig/xterm/package-lock.json "${RUNNER_TEMP}/linux-ctx/rig/xterm/"
          mkdir -p target/ci-event-logs/linux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Linux floor image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linux-ctx
          file: ${{ runner.temp }}/linux-ctx/rig/linux/Dockerfile
          tags: ${{ steps.linux-image.outputs.image_tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Format check
        run: ./rig/linux/run.sh cargo fmt --all --check

      - name: Clippy, tests, and docs
        run: |
          ./rig/linux/run.sh bash -c '
            set -euo pipefail
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
          '

      - name: Build and test at Rust 1.88 with every feature
        run: |
          ./rig/linux/run.sh bash -c '
            set -euo pipefail
            rustc --version | grep -E "^rustc 1\.88\."
            cargo build --workspace --all-features
            cargo test --workspace --all-features
          '

      - name: Build and test at Rust stable with every feature
        run: |
          ./rig/linux/run.sh bash -c '
            set -euo pipefail
            export RUSTUP_HOME=/tmp/tuikit-rustup-stable
            rustup toolchain install stable --profile minimal --no-self-update
            cargo +stable build --workspace --all-features
            cargo +stable test --workspace --all-features
          '

      - name: Feature checks
        run: ./rig/linux/run.sh ./scripts/ci/check-features.sh

      - name: xterm.js harness
        run: |
          mkdir -p target/ci-event-logs/linux/harness-tests
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/linux/harness-tests" \
            ./rig/linux/run.sh npm --prefix rig/xterm test
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/linux" \
            ./rig/linux/run.sh ./rig/xterm/run.sh capability_probe \
            > target/ci-event-logs/linux/stdout-xterm.json
          ./rig/linux/run.sh node rig/xterm/src/expected_compare.mjs \
            target/ci-event-logs/linux/stdout-xterm.json \
            rig/expected/xterm-linux.json
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/linux/mouse" \
            ./rig/linux/run.sh node rig/xterm/src/harness.mjs mouse_lab mouse \
            > target/ci-event-logs/linux/stdout-mouse.json

      - name: xterm.js harness in stock and full tmux
        run: |
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/linux" \
            ./rig/linux/run.sh ./rig/xterm/run-tmux.sh stock capability_probe \
            > target/ci-event-logs/linux/stdout-tmux-stock.json
          ./rig/linux/run.sh node rig/xterm/src/expected_compare.mjs \
            target/ci-event-logs/linux/stdout-tmux-stock.json \
            rig/expected/xterm-tmux-stock-linux.json
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/linux" \
            ./rig/linux/run.sh ./rig/xterm/run-tmux.sh full capability_probe \
            > target/ci-event-logs/linux/stdout-tmux-full.json
          ./rig/linux/run.sh node rig/xterm/src/expected_compare.mjs \
            target/ci-event-logs/linux/stdout-tmux-full.json \
            rig/expected/xterm-tmux-full-linux.json
          for configuration in stock full; do
            RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/linux/mouse-tmux-${configuration}" \
              ./rig/linux/run.sh node rig/xterm/src/tmux_session.mjs "$configuration" mouse_lab mouse \
              > "target/ci-event-logs/linux/stdout-mouse-tmux-${configuration}.json"
          done

      - name: Upload Linux event logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-event-logs
          path: target/ci-event-logs/linux
          if-no-files-found: ignore

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rig/xterm/package-lock.json

      - name: Install tmux and xterm.js harness dependencies
        run: |
          command -v tmux >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux
          npm --prefix rig/xterm ci
          npx --prefix rig/xterm playwright install chromium
          mkdir -p target/ci-event-logs/macos/harness-tests

      - name: Clippy, tests, and docs
        run: |
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --workspace --all-features
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps

      - name: Build and test at Rust 1.88 with every feature
        run: |
          rustc +1.88.0 --version | grep -E '^rustc 1\.88\.'
          cargo +1.88.0 build --workspace --all-features
          cargo +1.88.0 test --workspace --all-features

      - name: Feature checks
        run: ./scripts/ci/check-features.sh

      - name: xterm.js harness
        run: |
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/macos/harness-tests" \
            npm --prefix rig/xterm test
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/macos" \
            ./rig/xterm/run.sh capability_probe \
            > target/ci-event-logs/macos/stdout-xterm.json
          node rig/xterm/src/expected_compare.mjs \
            target/ci-event-logs/macos/stdout-xterm.json \
            rig/expected/xterm-macos.json
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/macos/mouse" \
            node rig/xterm/src/harness.mjs mouse_lab mouse \
            > target/ci-event-logs/macos/stdout-mouse.json

      - name: xterm.js harness in stock and full tmux
        run: |
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/macos" \
            ./rig/xterm/run-tmux.sh stock capability_probe \
            > target/ci-event-logs/macos/stdout-tmux-stock.json
          node rig/xterm/src/expected_compare.mjs \
            target/ci-event-logs/macos/stdout-tmux-stock.json \
            rig/expected/xterm-tmux-stock-macos.json
          RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/macos" \
            ./rig/xterm/run-tmux.sh full capability_probe \
            > target/ci-event-logs/macos/stdout-tmux-full.json
          node rig/xterm/src/expected_compare.mjs \
            target/ci-event-logs/macos/stdout-tmux-full.json \
            rig/expected/xterm-tmux-full-macos.json
          for configuration in stock full; do
            RIG_XTERM_LOG_DIR="${GITHUB_WORKSPACE}/target/ci-event-logs/macos/mouse-tmux-${configuration}" \
              node rig/xterm/src/tmux_session.mjs "$configuration" mouse_lab mouse \
              > "target/ci-event-logs/macos/stdout-mouse-tmux-${configuration}.json"
          done

      - name: Upload macOS event logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-event-logs
          path: target/ci-event-logs/macos
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rig/xterm/package-lock.json

      - name: Install xterm.js harness dependencies
        run: |
          New-Item -ItemType Directory -Force -Path target/ci-event-logs/windows/harness-tests | Out-Null
          npm --prefix rig/xterm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --prefix rig/xterm playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clippy, tests, and docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --workspace --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test -p rig-probe cmd_shim -- --nocapture | Tee-Object -FilePath target/ci-event-logs/windows/cmd-shim-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable doc --workspace --all-features --no-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test at Rust 1.88 with every feature
        run: |
          $rustcVersion = rustc +1.88.0 --version
          if ($LASTEXITCODE -ne 0 -or $rustcVersion -notmatch '^rustc 1\.88\.') {
            Write-Error "Unexpected Rust 1.88 toolchain output: $rustcVersion"
            exit 1
          }
          cargo +1.88.0 build --workspace --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 test --workspace --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Feature checks without Bash
        run: |
          $featureScript = @'
          import { execFileSync, spawnSync } from 'node:child_process';
          import path from 'node:path';
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--no-deps', '--format-version', '1'], { encoding: 'utf8' }));
          const cratesDirectory = path.resolve('crates') + path.sep;
          const packages = metadata.packages.filter(item => path.resolve(item.manifest_path).startsWith(cratesDirectory)
            && !(Array.isArray(item.publish) && item.publish.length === 0));
          if (packages.length === 0) throw new Error('No publishable workspace crates found');
          for (const item of packages.sort((left, right) => left.name.localeCompare(right.name))) {
            const base = ['check', '-p', item.name, '--all-targets'];
            const rows = [['--no-default-features']];
            for (const feature of Object.keys(item.features).sort()) {
              if (feature.startsWith('dep:') || (feature === 'default' && item.features.default.length === 0)) continue;
              rows.push(['--no-default-features', '--features', feature]);
            }
            rows.push(['--all-features']);
            for (const row of rows) {
              const args = [...base, ...row];
              process.stderr.write(`Checking: cargo ${args.join(' ')}\n`);
              const result = spawnSync('cargo', args, { stdio: 'inherit' });
              if (result.error) throw result.error;
              if (result.status !== 0) process.exit(result.status ?? 1);
            }
          }
          '@
          $featureScript | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: xterm.js harness
        run: |
          $env:RIG_XTERM_LOG_DIR = "${env:GITHUB_WORKSPACE}/target/ci-event-logs/windows/harness-tests"
          npm --prefix rig/xterm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = [Console]::OutputEncoding = $OutputEncoding = $utf8NoBom
          $env:RIG_XTERM_LOG_DIR = "${env:GITHUB_WORKSPACE}/target/ci-event-logs/windows"
          $stdoutJson = node rig/xterm/src/harness.mjs capability_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::WriteAllText("$PWD/target/ci-event-logs/windows/stdout-xterm.json", ($stdoutJson -join "`n") + "`n", $utf8NoBom)
          node rig/xterm/src/expected_compare.mjs target/ci-event-logs/windows/stdout-xterm.json rig/expected/xterm-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RIG_XTERM_LOG_DIR = "${env:GITHUB_WORKSPACE}/target/ci-event-logs/windows/mouse"
          $mouseJson = node rig/xterm/src/harness.mjs mouse_lab mouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::WriteAllText("$PWD/target/ci-event-logs/windows/stdout-mouse.json", ($mouseJson -join "`n") + "`n", $utf8NoBom)

      - name: Upload Windows event logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-event-logs
          path: target/ci-event-logs/windows
          if-no-files-found: warn
