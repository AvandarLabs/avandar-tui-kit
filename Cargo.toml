# The avandar-tui-kit workspace: one repository, several crates, and one
# umbrella crate that re-exports them behind features. See
# docs/architecture.md for the crate map and why it is split this way.
[workspace]
resolver = "3"
members = ["crates/*", "rig/probe"]

# Every crate inherits these with `<key>.workspace = true`, so a release bumps
# one version and every crate states the same edition, license and floor.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor ratatui 0.30 sets. Raising it is a decision: see
# docs/decisions.md.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/AvandarLabs/avandar-tui-kit"
homepage = "https://github.com/AvandarLabs/avandar-tui-kit"
authors = ["Avandar Labs, Inc."]

# One version of each shared dependency for the whole workspace. A crate opts
# in with `<name>.workspace = true` and adds only the features it needs, so an
# app never compiles two copies of ratatui because two of our crates disagreed.
[workspace.dependencies]
# Optional umbrella integration keeps the standalone crate independently usable.
ratatui-mouse = { path = "crates/ratatui-mouse", version = "0.1.0" }
# The rendering library every crate here builds on.
ratatui = { version = "0.30", default-features = false }
# The only terminal backend the toolkit supports for now: every source app
# reads crossterm's event types. Pinned to the version ratatui 0.30 builds
# against, so a `KeyEvent` from one is a `KeyEvent` to the other.
crossterm = "0.29"
# Grapheme boundaries for mouse selection over app-held text; already used by ratatui.
unicode-segmentation = "1"
# Optional emulator-backed mouse surfaces; apps without terminal panes do not compile it.
vt100 = "0.16"

# Example-only structured logs and settings; never normal library dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Example-only nonblocking terminal reply reads without unsafe code.
rustix = { version = "1", features = ["fs", "event"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Cell coordinates must use ratatui CellWidth per grapheme.
disallowed_methods = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Doc comments name types and crates in prose; backticking every one is noise.
doc_markdown = "allow"

# MouseSettings exposes independent user choices, not mutually exclusive states.
struct_excessive_bools = "allow"
